<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Movie Planner</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Our own styles -->
    <style>
        body { background: #14101f; color: #f1ebfa; }
        .card { background: #261d35; border: 0; color: #f1ebfa; }
        .card img { aspect-ratio: 2 / 3; object-fit: cover; }
        .no-poster { aspect-ratio: 2 / 3; background: #3a2d52; }
        .big-time { font-size: 2rem; font-weight: 700; color: #b794ff; }
        .btn-plan { background: #7a3cff; border: 0; color: #fff; }
        .btn-plan:hover { background: #6228d6; color: #fff; }
    </style>
</head>
<body>

<div class="container py-4">

    <h1 class="text-center mb-1">Movie Planner</h1>
    <p class="text-center text-secondary">How long does it take to watch it all?</p>

    <!-- Search bar -->
    <div class="row g-2 justify-content-center mb-3">
        <div class="col-12 col-md-5">
            <input type="text" id="query" class="form-control" placeholder="Search e.g. Game of Thrones">
        </div>
        <div class="col-6 col-md-2">
            <select id="type" class="form-select">
                <option value="tv">TV Show</option>
                <option value="movie">Movie</option>
            </select>
        </div>
        <div class="col-6 col-md-2 d-grid">
            <button id="searchBtn" class="btn btn-plan">Search</button>
        </div>
    </div>
    <p id="message" class="text-center text-secondary"></p>

    <div id="details" class="mb-4"></div>
    <div id="results" class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-3"></div>
    <p class="text-center text-secondary small mt-5">Data provided by TMDB</p>
</div>
<script src="FrontEndProject.js"></script>

</body>
</html>
